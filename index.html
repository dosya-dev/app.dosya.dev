<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The dashboard is not a search result. Every route serves this same
         shell, so without this each one is a thin duplicate titled "dosya.dev".
         See public/robots.txt and public/_headers for the other two layers. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>dosya.dev</title>
    <meta name="description" content="dosya.dev - secure file storage, sharing and requests." />
    <script src="/theme-init.js"></script>
    <style>
      /* Static splash: paints before any JS parses so a cold load is never a
         blank page. Colors mirror --background/--foreground from src/index.css
         (light + dark); theme-init.js has already put .dark on <html> when
         applicable. React's first render replaces #root's children with the
         identical seal loader (components/ui/seal-loader.tsx), so the handoff
         is seamless: same mark, same size, same breathing. */
      html { background: #f5f5f5; }
      html.dark { background: #131313; }
      #splash {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #181818;
      }
      html.dark #splash { color: #ededed; }
      #splash svg { width: 40px; height: 40px; }
      #splash .seal { fill: #16a34a; transform-box: fill-box; transform-origin: center;
        animation: splash-breathe 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      html.dark #splash .seal { fill: #22c55e; }
      @keyframes splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
      /* Added by splash-escape.js only if the app never mounts. Positioned under
         the mark so the seal does not move. */
      #splash { position: relative; }
      #splash .splash-escape { position: absolute; top: calc(50% + 44px); left: 0; right: 0;
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        font: 14px/1.4 system-ui, -apple-system, sans-serif; }
      #splash .splash-escape p { margin: 0; opacity: 0.6; }
      #splash .splash-escape button { font: inherit; font-size: 13px; padding: 5px 12px;
        border-radius: 8px; border: 1px solid rgba(127,127,127,0.35); background: transparent;
        color: inherit; cursor: pointer; }
      #splash .splash-escape button:hover { background: rgba(127,127,127,0.12); }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4.2l2.1 2.6h6.7A2.5 2.5 0 0 1 21 10.1v7.4A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle class="seal" cx="16.6" cy="14.6" r="2.1"/></svg>
        <noscript>dosya.dev needs JavaScript enabled.</noscript>
      </div>
    </div>
    <script src="/splash-escape.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
